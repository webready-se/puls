name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run tests

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run tests
        run: ./vendor/bin/pest

  release:
    runs-on: ubuntu-latest
    needs: test
    name: Build and publish release

    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite

      - name: Build release zip
        run: bash scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Validate release
        run: |
          cd build/puls-${{ steps.version.outputs.version }}
          cp .env.example .env
          php -S 127.0.0.1:8787 -t public &
          sleep 1
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/?health)
          kill %1 || true
          if [ "$code" != "200" ]; then
            echo "Health check failed with status $code"
            exit 1
          fi
          echo "Release validation passed (health check returned 200)"

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          version="${{ steps.version.outputs.version }}"
          changelog=$(awk "/^## \[${version}\]/{found=1; next} /^## \[/{found=0} found" CHANGELOG.md)
          # Write to file for gh release
          echo "$changelog" > build/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "build/puls-${{ steps.version.outputs.version }}.zip" \
            --title "Puls ${{ steps.version.outputs.version }}" \
            --notes-file build/release-notes.md

  # The image on GHCR, so docker run ghcr.io/webready-se/puls works without building.
  # Apart from the zip: a failed image can be run again without holding the release back.
  docker:
    runs-on: ubuntu-latest
    needs: test
    name: Build and publish Docker image
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the image for this runner
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: puls:release-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the image
        run: |
          docker run -d --name puls-check -p 8787:8080 -e ADMIN_PASSWORD=release-check puls:release-check
          code=000
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/?health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs puls-check
          docker rm -f puls-check
          if [ "$code" != "200" ]; then
            echo "Health check failed with status $code"
            exit 1
          fi
          echo "Image validation passed (health check returned 200)"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.32.0, 1.32 and latest
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

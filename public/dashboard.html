<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puls">
<meta name="theme-color" content="#f16272">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/?manifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="description" content="Cookieless, lightweight web analytics. One PHP file, SQLite, no cookies, full picture.">
<title>Puls</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect width='36' height='36' rx='8' fill='%23f16272'/><path d='M24 26V16M18 26V10M12 26v-8' stroke='white' stroke-width='2.5' stroke-linecap='round'/></svg>">
<script>
// Theme: apply immediately in <head> to prevent flash of wrong theme
// Hash params override localStorage (used by scripts/screenshots.sh)
(function() {
  var hash = {};
  location.hash.replace(/^#/, '').split('&').forEach(function(p) {
    var kv = p.split('='); if (kv[0]) hash[kv[0]] = decodeURIComponent(kv[1] || '');
  });
  if (hash.theme) localStorage.setItem('puls-theme', hash.theme);
  if (hash.compare) localStorage.setItem('puls-compare', hash.compare);
  if (hash.tabs) localStorage.setItem('puls-screenshot-tabs', hash.tabs);
  var s = localStorage.getItem('puls-theme') || 'system';
  if (s === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else if (s === 'light') document.documentElement.setAttribute('data-theme', 'light');
  // Apply branding accent color early to prevent flash
  var b = window.PULS_BRANDING;
  if (b && b.accent && b.accent !== '#f16272') {
    var st = document.documentElement.style;
    st.setProperty('--accent-tile', b.accent);
    if (b.accentText) {
      st.setProperty('--brand-text', b.accentText.light);
      st.setProperty('--brand-text-dark', b.accentText.dark);
    }
  }
})();
</script>
<link rel="stylesheet" href="dashboard.css?v=__PULS_VERSION__">
</head>
<body>

<a href="#app" class="skip-link">Skip to content</a>
<div class="header">
  <div class="logo pointer" onclick="selectSite('')">
    <div class="logo-icon">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>
      </svg>
    </div>
    <span class="logo-text">Puls</span>
    <span class="live-badge" id="live-badge" hidden aria-live="polite" aria-atomic="true">
      <span class="live-dot" aria-hidden="true"></span><span id="live-count">0</span> online now
    </span>
  </div>
  <div class="controls">
    <button class="search-btn" id="search-btn" onclick="openSearch()">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      Search<kbd>⌘K</kbd>
    </button>
    <div class="site-picker" id="site-picker" hidden>
      <button type="button" class="site-btn" id="site-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="site-list"><span class="sr-only">Site: </span><span id="site-btn-label">All sites</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="site-menu" id="site-menu" hidden>
        <input type="text" class="site-filter" id="site-filter" placeholder="Find a site..." aria-label="Find a site" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="site-list" aria-autocomplete="list" hidden>
        <div class="site-list" id="site-list" role="listbox" aria-label="Sites" tabindex="-1"></div>
      </div>
    </div>
    <div class="period-group" id="period-group">
      <button class="period-btn" data-days="1">Today</button>
      <button class="period-btn active" data-days="7">7 days</button>
      <button class="period-btn" data-days="30">30 days</button>
      <button class="period-btn" data-days="90">90 days</button>
      <button class="period-btn" id="custom-range-btn" onclick="toggleDatePicker(event)" aria-label="Custom date range">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="icon-14"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
      </button>
    </div>
    <div class="date-picker" id="date-picker">
      <label>From<input type="date" id="date-from" aria-label="Start date"></label>
      <label>To<input type="date" id="date-to" aria-label="End date"></label>
      <button class="date-picker-apply" onclick="applyDateRange()">Apply</button>
    </div>
    <button class="menu-btn" id="menu-btn" onclick="openMenu()" aria-label="Menu">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></svg>
    </button>
  </div>
</div>

<div class="ptr-indicator" id="ptr">
  <div class="ptr-spinner" id="ptr-spinner"></div>
  <span class="ptr-text" id="ptr-text">Refresh</span>
</div>

<div class="sr-only" id="sr-status" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="toast" id="toast" hidden><span id="toast-text"></span><button type="button" id="toast-undo">Undo</button></div>
<main class="wrap" id="app">
  <div class="loading">
    <div class="loading-spinner" aria-hidden="true"></div>
    Loading stats...
  </div>
</main>

<div class="menu-overlay" id="menu-overlay" onclick="closeMenu()"></div>
<div class="menu-panel" id="menu-panel" role="dialog" aria-modal="true" aria-labelledby="menu-title">
  <div class="menu-header">
    <span id="menu-title">Settings</span>
    <button class="menu-close" onclick="closeMenu()" aria-label="Close settings"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="menu-section">
    <span class="menu-label">Appearance</span>
    <div class="theme-toggle" id="theme-toggle">
      <button data-value="system" title="System"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>Auto</button>
      <button data-value="light" title="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>Light</button>
      <button data-value="dark" title="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>Dark</button>
    </div>
  </div>
  <div class="menu-section" id="export-section">
    <span class="menu-label">Export</span>
    <div class="export-btns">
      <button class="export-btn" onclick="exportData('csv')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        CSV
      </button>
      <button class="export-btn" onclick="exportData('json')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/></svg>
        JSON
      </button>
    </div>
  </div>
  <div class="menu-section" id="notes-section" hidden>
    <button type="button" class="fold-row fold-toggle menu-fold-toggle" aria-expanded="false" aria-controls="notes-body">
      <span class="menu-label" id="notes-label">Chart notes</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg><span class="fold-summary" id="notes-summary"></span>
    </button>
    <div class="menu-fold-body" id="notes-body" hidden>
    <div class="note-list" id="note-list" aria-labelledby="notes-label"></div>
    <p class="excluded-hint" id="notes-empty">Add one with + Note above the chart.</p>
    </div>
  </div>
  <div class="menu-section" id="excluded-section" hidden>
    <button type="button" class="fold-row fold-toggle menu-fold-toggle" aria-expanded="false" aria-controls="excluded-body">
      <span class="menu-label" id="excluded-label">Excluded IPs</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg><span class="fold-summary" id="excluded-summary"></span>
    </button>
    <div class="menu-fold-body" id="excluded-body" hidden>
    <div class="excluded-mine" id="excluded-mine"></div>
    <div class="excluded-list" id="excluded-list" aria-labelledby="excluded-label"></div>
    <form class="note-form excluded-form" id="excluded-form" onsubmit="addExcluded(event)">
      <input type="text" name="ip" required maxlength="50" placeholder="IP or range, e.g. 81.2.3.0/24" aria-label="IP address or range to exclude" autocomplete="off" spellcheck="false">
      <input type="text" name="label" maxlength="100" placeholder="Label, e.g. Office" aria-label="Label (optional)">
      <button type="submit">Exclude</button>
    </form>
    <p class="excluded-hint">Pageviews and events from these addresses are not stored.</p>
    </div>
  </div>
  <div class="menu-section" id="goals-section" hidden>
    <button type="button" class="fold-row fold-toggle menu-fold-toggle" aria-expanded="false" aria-controls="goals-body">
      <span class="menu-label">Goals</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg><span class="fold-summary" id="goals-summary"></span>
    </button>
    <div class="menu-fold-body" id="goals-body" hidden>
    <input type="text" class="goal-search" id="goal-search" placeholder="Search pages or events..." aria-label="Search pages or events for conversion goal" autocomplete="off" spellcheck="false">
    <div class="goal-list" id="goal-list"></div>
    </div>
  </div>
  <div class="flex-1"></div>
  <a href="/?logout" class="menu-logout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Log out
  </a>
</div>

<div class="cmd-overlay" id="cmd-overlay" onclick="if(event.target===this)closeSearch()">
  <div class="cmd-dialog" id="cmd-dialog" role="dialog" aria-modal="true" aria-label="Search pages">
    <div class="cmd-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="cmd-input" id="cmd-input" type="text" placeholder="Search pages..." aria-label="Search pages" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="cmd-results" aria-autocomplete="list">
    </div>
    <div class="cmd-results" id="cmd-results" role="listbox" aria-label="Results"></div>
    <div class="cmd-hint" id="cmd-hint">↑↓ navigate · Enter open · Esc close</div>
  </div>
</div>

<script src="dashboard.js?v=__PULS_VERSION__"></script>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeOverlay()">
  <div class="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div class="overlay-header">
      <span class="card-title" id="overlay-title"></span>
      <button class="overlay-close" onclick="closeOverlay()" aria-label="Close">&times;</button>
    </div>
    <div id="overlay-content"></div>
  </div>
</div>
</body>
</html>
